version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: vpsmaster-db
    restart: always
    environment:
      POSTGRES_DB: vpsmaster
      POSTGRES_USER: vpsmaster
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vpsmaster_secret_pass_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - vpsmaster-net

  # Redis Task Queue & Caching
  redis:
    image: redis:7-alpine
    container_name: vpsmaster-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - vpsmaster-net

  # Server Management Agent
  server-agent:
    build:
      context: ../../server-agent
      dockerfile: Dockerfile
    container_name: vpsmaster-agent
    restart: always
    privileged: true
    environment:
      AGENT_SECRET_KEY: ${AGENT_SECRET_KEY:-vpsmaster-internal-agent-secret-key-32chars}
      AGENT_PORT: 8001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/nginx:/etc/nginx
      - /var/www:/var/www
      - /var/log:/var/log
    networks:
      - vpsmaster-net

  # FastAPI Backend REST & WS
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: vpsmaster-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://vpsmaster:${DB_PASSWORD:-vpsmaster_secret_pass_2026}@postgres:5432/vpsmaster
      AGENT_URL: http://server-agent:8001
      AGENT_SECRET_KEY: ${AGENT_SECRET_KEY:-vpsmaster-internal-agent-secret-key-32chars}
      SECRET_KEY: ${JWT_SECRET:-super-jwt-secret-key-minimum-32-chars-long}
    depends_on:
      - postgres
      - redis
      - server-agent
    networks:
      - vpsmaster-net

  # Frontend Nginx Gateway
  gateway:
    image: nginx:alpine
    container_name: vpsmaster-gateway
    restart: always
    ports:
      - "8443:8443"
    volumes:
      - ../nginx/vpsmaster.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../frontend/dist:/opt/vpsmaster/frontend/dist:ro
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - vpsmaster-net

networks:
  vpsmaster-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:

